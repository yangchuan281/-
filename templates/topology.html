{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>网络拓扑</h2>
    <button class="btn btn-primary" id="discover-btn">自动发现拓扑</button>
</div>

<div id="topology" style="height: 600px; border: 1px solid #ddd;"></div>

<h4 class="mt-4">已管理设备</h4>
<ul class="list-group">
    {% for d in devices %}
    <li class="list-group-item">{{ d.name }} ({{ d.ip }})</li>
    {% endfor %}
</ul>
{% endblock %}

{% block scripts %}
<script src="https://cdn.bootcdn.net/ajax/libs/vis-network/9.1.2/vis-network.min.js"></script>
<link href="https://cdn.bootcdn.net/ajax/libs/vis-network/9.1.2/dist/vis-network.min.css" rel="stylesheet">
<script>
const container = document.getElementById('topology');
const options = {
    physics: { solver: 'forceAtlas2Based', stabilization: { iterations: 100 } },
    edges: { arrows: { to: { enabled: false } }, smooth: true },
};

document.getElementById('discover-btn').addEventListener('click', function() {
    this.disabled = true;
    this.textContent = '发现中...';
    fetch('/topology/discover')
        .then(r => r.json())
        .then(data => {
            const nodes = new vis.DataSet(data.nodes.map(n => ({
                id: n.id, label: n.label, title: n.ip,
                shape: 'box', margin: 10
            })));
            const edges = new vis.DataSet(data.edges.map(e => ({
                from: e.from, to: e.to, label: e.label || ''
            })));
            new vis.Network(container, { nodes, edges }, options);
        })
        .finally(() => {
            this.disabled = false;
            this.textContent = '重新发现';
        });
});
</script>
{% endblock %}
