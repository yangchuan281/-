{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>状态监控</h2>
    <div>
        <button class="btn btn-success" id="collect-btn">采集数据</button>
    </div>
</div>

{% if devices %}
<div class="row">
    {% for d in devices %}
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header d-flex justify-content-between">
                <strong>{{ d.name }}</strong>
                <small class="text-muted">{{ d.ip }}</small>
            </div>
            <div class="card-body">
                <canvas id="chart-{{ d.id }}" height="200"></canvas>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="alert alert-info">请先添加设备。</div>
{% endif %}
{% endblock %}

{% block scripts %}
<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const charts = {};

function initChart(deviceId) {
    const ctx = document.getElementById('chart-' + deviceId);
    if (!ctx) return;
    charts[deviceId] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: 'CPU %', data: [], borderColor: 'red', tension: 0.3 },
                { label: 'Memory %', data: [], borderColor: 'blue', tension: 0.3 },
            ]
        },
        options: {
            responsive: true,
            scales: { y: { min: 0, max: 100 } }
        }
    });
}

function updateChart(deviceId) {
    fetch(`/monitor/data/${deviceId}`)
        .then(r => r.json())
        .then(data => {
            const chart = charts[deviceId];
            if (!chart) return;
            chart.data.labels = data.timestamps;
            chart.data.datasets[0].data = data.cpu;
            chart.data.datasets[1].data = data.memory;
            chart.update();
        });
}

document.getElementById('collect-btn').addEventListener('click', function() {
    this.disabled = true;
    this.textContent = '采集中...';
    fetch('/monitor/collect', { method: 'POST' })
        .then(r => r.json())
        .then(() => {
            {% for d in devices %}
            updateChart({{ d.id }});
            {% endfor %}
        })
        .finally(() => {
            this.disabled = false;
            this.textContent = '采集数据';
        });
});

{% for d in devices %}
initChart({{ d.id }});
{% endfor %}
</script>
{% endblock %}
