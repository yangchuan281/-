{% extends "base.html" %}
{% block content %}
<h2>{{ '编辑设备' if device else '添加设备' }}</h2>
<form method="post" class="mt-3">
    <div class="mb-3">
        <label class="form-label">设备名称</label>
        <input type="text" name="name" class="form-control" value="{{ device.name if device else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">IP 地址</label>
        <input type="text" name="ip" class="form-control" value="{{ device.ip if device else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">设备类型</label>
        <select name="device_type" class="form-select" required>
            <option value="cisco_ios" {{ 'selected' if device and device.device_type == 'cisco_ios' else '' }}>Cisco IOS</option>
            <option value="cisco_xe" {{ 'selected' if device and device.device_type == 'cisco_xe' else '' }}>Cisco XE</option>
            <option value="huawei" {{ 'selected' if device and device.device_type == 'huawei' else '' }}>华为</option>
            <option value="vyos" {{ 'selected' if device and device.device_type == 'vyos' else '' }}>VyOS</option>
            <option value="linux" {{ 'selected' if device and device.device_type == 'linux' else '' }}>Linux</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">SSH 端口</label>
        <input type="number" name="port" class="form-control" value="{{ device.port if device else 22 }}">
    </div>
    <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-control" value="{{ device.username if device else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-control" value="{{ device.password if device else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Enable 密码（可选）</label>
        <input type="password" name="enable_secret" class="form-control" value="{{ device.enable_secret if device else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">{{ '保存修改' if device else '添加' }}</button>
    <a href="/" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
