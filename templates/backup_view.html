{% extends "base.html" %}
{% block content %}
<h2>配置备份 #{{ backup.id }}</h2>
<p class="text-muted">备份时间: {{ backup.created_at.strftime('%Y-%m-%d %H:%M:%S') }}</p>
<a href="/device/{{ backup.device_id }}" class="btn btn-secondary mb-3">返回设备详情</a>
<pre class="border p-3 bg-light" style="max-height: 600px; overflow-y: auto;">{{ backup.content }}</pre>
{% endblock %}
